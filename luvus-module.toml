id = "asahiart.agent-titles"
name = "Agent Titles"
version = "0.1.0"
min_luvus_version = "0.14.1"
description = "Publish human titles onto resumable AGENTS sidebar rows."

# Titles are in-memory. Repaint after a restart and whenever resume rows change.
[[startup]]
command = ["python3", "refresh.py"]

[[events]]
on = "pane.created"
command = ["python3", "refresh.py"]

[[events]]
on = "pane.closed"
command = ["python3", "refresh.py"]

[[events]]
on = "pane.forked"
command = ["python3", "refresh.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "refresh.py"]

[[events]]
on = "workspace.created"
command = ["python3", "refresh.py"]

[[actions]]
id = "refresh"
title = "Refresh agent titles"
command = ["python3", "refresh.py"]
